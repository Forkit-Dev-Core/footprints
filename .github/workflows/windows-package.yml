name: Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'scripts/**'
      - 'serve.py'
      - 'index.html'
      - 'discovery.js'
      - 'passport.js'
      - 'passports.js'
      - 'repositories.js'
      - 'ui.js'
      - 'collector.py'
      - 'repos.py'
      - 'repo_passports.py'
      - 'tool_passports.py'
      - 'requirements.txt'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  package:
    name: Windows package smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          architecture: x64
      - run: python scripts/build_windows.py '${{ runner.temp }}/footprints'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprints-windows-release-files
          path: |
            ${{ runner.temp }}/footprints/Footprints-Windows-x64.zip
            ${{ runner.temp }}/footprints/Footprints-Windows-x64.zip.sha256
          if-no-files-found: error

  attest:
    name: Attest Windows release ZIP
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: footprints-windows-release-files
      - name: Verify ZIP checksum
        run: sha256sum --check --strict Footprints-Windows-x64.zip.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Footprints-Windows-x64.zip
